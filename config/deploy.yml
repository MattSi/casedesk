# Deploy with: bin/kamal setup (first time), then bin/kamal deploy
service: casedesk
image: casedesk

servers:
  web:
    - 34.53.18.239

# kamal-proxy gets a Let's Encrypt certificate for this host
proxy:
  ssl: true
  host: casedesk-mattsi.duckdns.org

# Kamal runs a registry on this machine and pushes to the server over SSH,
# so no Docker Hub or GitHub registry account is needed
registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY
    - CASEDESK_DATABASE_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: true
    DB_HOST: casedesk-mysql

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "casedesk_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

ssh:
  user: mians
  keys: [ "~/.ssh/casedesk" ]

accessories:
  mysql:
    image: mysql:8.4
    host: 34.53.18.239
    env:
      clear:
        MYSQL_USER: casedesk
      secret:
        - MYSQL_ROOT_PASSWORD
        - MYSQL_PASSWORD
    files:
      - config/mysql/grants.sql:/docker-entrypoint-initdb.d/grants.sql
      - config/mysql/small-server.cnf:/etc/mysql/conf.d/small-server.cnf
    directories:
      - data:/var/lib/mysql